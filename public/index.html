<!doctype html>
<html lang="es-CO">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Oddsy Bet</title>
  <meta name="description" content="Estadísticas reales de jugadores y partidos, con cuotas calculadas por Oddsy, para analizar tus apuestas." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2311161f'/><path d='M22 10a8 8 0 1 0 0 12' stroke='%23c6f432' stroke-width='4' fill='none' stroke-linecap='round'/></svg>" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Oddsy" />
  <meta name="theme-color" content="#000000" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" />
  <!-- Módulos base: el navegador los pide en paralelo en vez de descubrirlos import por import. -->
  <link rel="modulepreload" href="app.js" />
  <link rel="modulepreload" href="api.js" />
  <link rel="modulepreload" href="store.js" />
  <link rel="modulepreload" href="ui.js" />
  <link rel="modulepreload" href="leagues.js" />
  <link rel="modulepreload" href="betmath.js" />
  <link rel="modulepreload" href="stats.js" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="css/shell.css" />
  <link rel="stylesheet" href="css/props.css" />
  <link rel="stylesheet" href="css/games.css" />
  <link rel="stylesheet" href="css/live.css" />
  <link rel="stylesheet" href="css/insights.css" />
  <link rel="stylesheet" href="css/popular.css" />
  <link rel="stylesheet" href="css/tennis.css" />
  <link rel="stylesheet" href="css/seguir.css" />
  <link rel="stylesheet" href="css/stadium.css" />
  <link rel="stylesheet" href="css/chat.css" />
</head>
<body>
  <a class="skip" href="#view" data-skip>Saltar al contenido</a>

  <header class="top">
    <a class="brand" href="#/nba/props" aria-label="Oddsy Bet, inicio"><span class="logo" aria-hidden="true"></span> oddsy<b>bet</b></a>
    <div class="top-actions">
      <div class="seg" role="group" aria-label="Formato de cuotas">
        <button type="button" data-odds="decimal" aria-pressed="true">Decimal</button>
        <button type="button" data-odds="american" aria-pressed="false">Americana</button>
      </div>
    </div>
  </header>

  <div class="shell">
    <nav class="side" id="nav" aria-label="Secciones">
      <a data-nav="insights" href="#/nba/insights"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2V16h5v-.1c0-.8.4-1.5 1-2A6 6 0 0 0 12 3Z"/></svg><span>Tendencias</span></a>
      <a data-nav="popular" href="#/nba/popular"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3c1 3 4 4.5 4 8.5a4 4 0 0 1-8 0c0-1.5.7-2.6 1.5-3.5.2 1.5 1 2.3 2 2.5C11 8 11.5 5 12 3Z"/><path d="M6 14a6 6 0 0 0 12 0"/></svg><span>Populares</span></a>
      <a data-nav="games" href="#/nba/games"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Partidos</span></a>
      <a data-nav="live" href="#/nba/live"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M8.5 15.5a5 5 0 0 1 0-7M15.5 8.5a5 5 0 0 1 0 7M5.6 18.4a9 9 0 0 1 0-12.8M18.4 5.6a9 9 0 0 1 0 12.8"/></svg><span>En vivo</span></a>
      <a data-nav="picks" href="#/nba/picks"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 4 6v6c0 4.5 3.4 8 8 9 4.6-1 8-4.5 8-9V6l-8-3Z"/><path d="m9 12 2 2 4-4"/></svg><span>Mejores apuestas</span></a>
      <a data-nav="props" href="#/nba/props"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg><span>Props</span></a>
      <a data-nav="seguir" href="#/nba/seguir"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4l2-2Z"/><path d="M10 21h4"/></svg><span>Mis apuestas</span></a>
    </nav>

    <div class="content">
      <nav class="chips league-chips" id="leagues" aria-label="Ligas" hidden></nav>
      <main id="view" tabindex="-1"></main>
      <footer>+18. Ninguna apuesta es segura: juega con responsabilidad. Datos de ESPN; cuotas calculadas por Oddsy.</footer>
    </div>

    <aside class="slip" id="slip" aria-labelledby="slipTitle">
      <div class="slip-head">
        <h2 id="slipTitle" tabindex="-1">Mis picks <span class="count" id="slipCount"></span></h2>
        <button type="button" class="icon-btn slip-close" data-slip-close aria-label="Cerrar Mis picks">✕</button>
      </div>
      <div class="slip-body" id="slipBody"></div>
      <div class="slip-foot" id="slipFoot"></div>
    </aside>
  </div>

  <button type="button" class="slip-fab" id="slipFab" aria-controls="slip" aria-expanded="false">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v3a2 2 0 0 0 0 4v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-3a2 2 0 0 0 0-4Z"/><path d="M14 5v14" stroke-dasharray="2 2"/></svg>
    <span class="sr-only">Mis picks</span><span class="fab-count" id="fabCount">0</span>
  </button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
